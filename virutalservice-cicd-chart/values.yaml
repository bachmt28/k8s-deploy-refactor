appLabel: ""    # 🔶 Chỉ cần để trống, sẽ kế thừa giá trị từ app trong value cicd 
env: ""         # 🔶 Chỉ cần để trống, sẽ kế thừa giá trị từ app trong value cicd 
org: ""         # 🔶 Chỉ cần để trống, sẽ kế thừa giá trị từ app trong value cicd 
system: ""      # 🔶 Chỉ cần để trống, sẽ kế thừa giá trị từ app trong value cicd 

versionList: # 🔴 Bắt buộc điền khớp version chính xác
  - v1
  - v2

serviceMesh:
  istio:
    apiVersion: networking.istio.io/v1
    enabled: true
    hosts: 
    - 172.28.199.231
    gateways:
    - asm-gateway/test-ingress
    port:
      number: 80
    useDestinationRule: false

routing:
  prefix: "/"

  # BẬT nếu muốn rewrite path về "/" (hoặc chuỗi khác)
  rewrite:
    enabled: false
    to: "/"

  # Timeout/retries áp cho từng HTTP rule (canary & split)
  timeout: 60s
  retries: {}

  # Tỉ lệ mặc định (tổng nên = 100; nếu lệch sẽ có annotation cảnh báo)
  canaries: {} # 🔴 Bắt buộc điền khớp tỷ lệ chính xác, nếu sử dụng
    # v1: 85
    # v2: 15

  # Nhiều canary rule; mỗi item dùng EITHER header hoặc cookie
  abTesting: {}
    # - header:
    #     name: end-user
    #     match: exact       # exact|prefix|regex
    #     value: canary
    #   toVersion: v2
    #   percent: 100

    # - cookie:
    #     name: exp
    #     match: exact       # exact|prefix|regex (áp vào cookie value)
    #     value: new
    #   toVersion: v2
    #   percent: 100
